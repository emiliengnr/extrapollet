name: Déploiement GitHub Pages

on:
  push:
    branches: [master]
  # Permet aussi de relancer un déploiement à la main depuis l'onglet Actions
  workflow_dispatch:

# Droits requis par les actions officielles Pages
permissions:
  contents: read
  pages: write
  id-token: write

# Un seul déploiement à la fois ; les pushes suivants annulent le précédent
concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  construction:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      # npm ci installe exactement ce que fige package-lock.json
      - run: npm ci
      - run: npm run build

      - uses: actions/configure-pages@v5
      - uses: actions/upload-pages-artifact@v3
        with:
          path: dist

  deploiement:
    needs: construction
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deploiement.outputs.page_url }}
    steps:
      - id: deploiement
        uses: actions/deploy-pages@v4
